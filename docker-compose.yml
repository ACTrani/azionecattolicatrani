# Local development environment for the legacy MkPortal + SMF 1.1 site.
# Runs the original PHP 5.6 code unmodified against a local MariaDB.
#
#   docker compose up -d --build      start (web on http://localhost:8080)
#   docker compose down               stop
#   docker compose logs -f web        follow Apache/PHP logs
#
# Images run native on Apple Silicon (arm64). MariaDB 10.6 is a drop-in
# MySQL replacement for the legacy SMF 1.1 code.

services:
  web:
    build: ./docker
    ports:
      - "8080:80"
    volumes:
      - ./www.azionecattolicatrani.it:/var/www/html
    depends_on:
      - db

  db:
    image: mariadb:10.6
    # Empty sql_mode = permissive (like the MySQL 5.0 era SMF 1.1 was built for):
    # allows INSERTs that omit NOT-NULL columns without defaults.
    command: --character-set-server=utf8 --collation-server=utf8_general_ci --sql-mode=""
    environment:
      # Local-only throwaway credentials; they must match acforum/Settings.php.
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mkportal
      MYSQL_USER: mkportal
      MYSQL_PASSWORD: mkportal
    volumes:
      - dbdata:/var/lib/mysql
      # Auto-runs on FIRST init of an empty data volume (alphabetical order):
      # recreates the full SMF + MKPortal schema, seed data, fixes, and admin user.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "3307:3306"

volumes:
  dbdata:
